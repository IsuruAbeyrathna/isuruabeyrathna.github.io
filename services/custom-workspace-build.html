  /* ═══════════════════════════════════════════════════════════
     Case-study image showcase — ported verbatim from the WordPress

  .cs-cr{position:relative;margin:8px 0 0;border-radius:12px;overflow:hidden;border:1px solid var(--border);background:#0d0d0d;}

  .cs-cr-arrow{color:#fff;font-size:28px;opacity:0.5;transition:opacity .15s;line-height:1;text-shadow:0 1px 6px rgba(0,0,0,0.6);}
  .cs-cr-btn:hover .cs-cr-arrow{opacity:1;}

  /* System Architecture: fixed frame, capped at 480px tall so it never

  .cs-arch-static{position:relative;margin:8px 0 0;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#fff;cursor:zoom-in;height:480px;}

  /* Fullscreen lightbox */
  .cs-lb-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.94);z-index:10000;display:flex;align-items:center;justify-content:center;animation:csLbFade .18s ease;cursor:default;}

  .cs-lb-img-wrap{width:100%;height:100%;overflow:auto;display:flex;align-items:center;justify-content:center;}

  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  .fu{opacity:0;animation:fadeUp .35s ease forwards;}
  .d1{animation-delay:.05s}.d2{animation-delay:.12s}.d3{animation-delay:.2s}.d4{animation-delay:.28s}.d5{animation-delay:.36s}
`;

function CaseStudyImages({ images, variant }) {
  // current carousel slide
  const [current, setCurrent] = React.useState(0);
  // lightbox: null when closed, otherwise the index of the image being shown
  const [lbIdx, setLbIdx] = React.useState(null);
  // zoom level: 1 = fit, 2.5 = zoomed in (matches WP)
  const [lbZoom, setLbZoom] = React.useState(1);
  // click coords captured at zoom-in time, so the wrap can scroll to centre on the click
  const [pendingScroll, setPendingScroll] = React.useState(null);

  const lbWrapRef = React.useRef(null);
  const lbImgRef = React.useRef(null);
  const touchStartX = React.useRef(null);
  const total = images ? images.length : 0;

  // Carousel nav (loops, matches WP goTo)
  const goTo = (idx) => {
    let n = idx;
    if (n < 0) n = total - 1;
    if (n >= total) n = 0;
    setCurrent(n);
  };

  // Lightbox open/close
  const openLb = (i) => { setLbIdx(i); setLbZoom(1); };
  const closeLb = () => { setLbIdx(null); setLbZoom(1); };

  // Lightbox nav (no loop, matches WP lbNav)
  const lbNav = (dir) => {
    if (lbIdx === null || total <= 1) return;
    const n = lbIdx + dir;
    if (n < 0 || n >= total) return;
    setLbIdx(n);
    setLbZoom(1);
  };

  // Keyboard handlers + body scroll lock while lightbox is open (matches WP)
  React.useEffect(() => {
    if (lbIdx === null) return;
    const handler = (e) => {
      if (e.key === 'Escape') closeLb();
      else if (e.key === 'ArrowLeft') lbNav(-1);
      else if (e.key === 'ArrowRight') lbNav(1);
    };
    document.addEventListener('keydown', handler);
    document.body.style.overflow = 'hidden';
    return () => {
      document.removeEventListener('keydown', handler);
      document.body.style.overflow = '';
    };
  }, [lbIdx]);

  // After zoom-in, scroll the wrap so the click point is centred (matches WP setTimeout 50ms)
  React.useEffect(() => {
    if (!pendingScroll || lbZoom <= 1) return;
    const t = setTimeout(() => {
      const w = lbWrapRef.current;
      if (w) {
        w.scrollLeft = pendingScroll.relX * w.scrollWidth - w.clientWidth / 2;
        w.scrollTop = pendingScroll.relY * w.scrollHeight - w.clientHeight / 2;
      }
      setPendingScroll(null);
    }, 50);
    return () => clearTimeout(t);
  }, [pendingScroll, lbZoom]);

  // Reset scroll on zoom-out (matches WP applyLbZoom else branch)
  React.useEffect(() => {
    if (lbZoom > 1) return;
    const w = lbWrapRef.current;
    if (w) { w.scrollLeft = 0; w.scrollTop = 0; }
  }, [lbZoom, lbIdx]);

  // Image click inside lightbox: zoom toggle (matches WP exactly)
  const onLbImgClick = (e) => {
    e.stopPropagation();
    if (lbZoom > 1) {
      setLbZoom(1);
    } else {
      const img = lbImgRef.current;
      if (!img) return;
      const rect = img.getBoundingClientRect();
      const relX = (e.clientX - rect.left) / rect.width;
      const relY = (e.clientY - rect.top) / rect.height;
      setPendingScroll({ relX, relY });
      setLbZoom(1.5);
    }
  };

  // Click anywhere in overlay that isn't the image: if zoomed, zoom out; else close (matches WP)
  const onOverlayClick = (e) => {
    if (e.target === lbImgRef.current) return;
    if (lbZoom > 1) { setLbZoom(1); return; }
    closeLb();
  };

  // Touch / swipe on the carousel
  const onTouchStart = (e) => { touchStartX.current = e.touches[0].clientX; };
  const onTouchEnd = (e) => {
    if (touchStartX.current === null) return;
    const diff = touchStartX.current - e.changedTouches[0].clientX;
    if (Math.abs(diff) > 50) {
      if (diff > 0) goTo(current + 1);
      else goTo(current - 1);
    }
    touchStartX.current = null;
  };

  if (!images || images.length === 0) return null;

  const inlineLbImgStyle = lbZoom > 1
    ? { width: (lbZoom * 90) + 'vw', height: 'auto', maxWidth: 'none', maxHeight: 'none' }
    : {};

  const hint = lbZoom > 1
    ? "Click image to zoom out \u00B7 scroll to explore"
    : "Click image to zoom \u00B7 click outside to close";

  // Static variant: a fixed bordered frame (System Architecture). No carousel
  // chrome, no dots, no arrows. Click opens the lightbox like attachment 5.
  const renderStaticFrame = () => (
    <div className="cs-arch-static" onClick={() => openLb(0)}>
      <img src={images[0]} alt="" loading="lazy" />
    </div>
  );

  return (
    <>
      {variant === "static" ? renderStaticFrame() : (
      <>
      {/* Single image: just render plain image, no carousel chrome. */}
      {total === 1 ? (
        <div className="cs-cr">
          <div className="cs-cr-stage">
            <img
              className="cs-cr-active"
              src={images[0]}
              alt=""
              onClick={() => openLb(0)}
              loading="lazy"
            />
          </div>
        </div>
      ) : (
        <div className="cs-cr" onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>
          {/* Stage: the CURRENT image is in-flow and sets the carousel's height.
              Other images are absolutely positioned and faded out, so a tall
              first slide doesn't leave dead space around a shorter next slide. */}
          <div className="cs-cr-stage">
            {images.map((src, i) => (
              <img
                key={i}
                className={i === current ? "cs-cr-active" : "cs-cr-inactive"}
                src={src}
                alt=""
                onClick={() => openLb(i)}
                loading={i === current ? "eager" : "lazy"}
              />
            ))}
          </div>
          <button
            className="cs-cr-btn cs-cr-prev"
            onClick={() => goTo(current - 1)}
            aria-label="Previous"
            type="button"
          >
            <span className="cs-cr-arrow">{'\u2039'}</span>
          </button>
          <button
            className="cs-cr-btn cs-cr-next"
            onClick={() => goTo(current + 1)}
            aria-label="Next"
            type="button"
          >
            <span className="cs-cr-arrow">{'\u203A'}</span>
          </button>
          <div className="cs-cr-dots">
            {images.map((_, i) => (
              <button
                key={i}
                className={`cs-cr-dot${i === current ? ' active' : ''}`}
                onClick={() => goTo(i)}
                aria-label={`Go to slide ${i + 1}`}
                type="button"
              />
            ))}
          </div>
        </div>
      )}
      </>
      )}

      {/* Lightbox — only rendered when open */}
      {lbIdx !== null && (
        <div className="cs-lb-overlay" onClick={onOverlayClick}>
          <button
            className="cs-lb-close"
            aria-label="Close"
            onClick={(e) => { e.stopPropagation(); closeLb(); }}
            type="button"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" width="18" height="18"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
          <div className="cs-lb-hint">{hint}</div>

          {total > 1 && (
            <button
              className="cs-lb-arrow cs-lb-arrow-prev"
              aria-label="Previous image"
              disabled={lbIdx === 0}
              onClick={(e) => { e.stopPropagation(); lbNav(-1); }}
              type="button"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </button>
          )}

          <div
            ref={lbWrapRef}
            className={`cs-lb-img-wrap${lbZoom > 1 ? ' zoomed' : ''}`}
          >
            <img
              ref={lbImgRef}
              className={`cs-lb-img${lbZoom > 1 ? ' zoomed-img' : ''}`}
              src={images[lbIdx]}
              alt=""
              draggable={false}
              style={inlineLbImgStyle}
              onClick={onLbImgClick}
            />
          </div>

          {total > 1 && (
            <button
              className="cs-lb-arrow cs-lb-arrow-next"
              aria-label="Next image"
              disabled={lbIdx === total - 1}
              onClick={(e) => { e.stopPropagation(); lbNav(1); }}
              type="button"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>
            </button>
          )}

          {total > 1 && (
            <div className="cs-lb-counter">{(lbIdx + 1)} / {total}</div>
          )}
        </div>
      )}
    </>
  );
}
